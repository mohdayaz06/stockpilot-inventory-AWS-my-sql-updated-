version: "3.9"

services:

  backend:
    build: ./backend
    image: stockpilot-backend:v1
    container_name: backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: stockpilot
      DB_SSL: "false"
      JWT_SECRET: stockpilot-secret
    ports:
      - "5000:5000"
    networks:
      - stockpilot-network

  frontend:
    build: ./frontend
    image: stockpilot-frontend:v1
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - stockpilot-network

networks:
  stockpilot-network:
